campaign:
  name: Founders & Leaders
  objective: activated_signup

target:
  segments:
    - leadership_high_icp
  max_per_company: 1

strategy:
  primary: warm_relationship
  alternatives:
    - conversation_first
    - problem_first

limits:
  max_new_prospects_per_batch: 8
  min_evidence_confidence: 0.5
  min_priority: 45
  contact_cooldown_days: 90

sequence:
  follow_up_days: [5, 12]
  max_follow_ups: 1

approval:
  required: true

attribution:
  source: linkedin
