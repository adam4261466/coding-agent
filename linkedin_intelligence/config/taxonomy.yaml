# Professional taxonomy for normalizing raw LinkedIn positions and companies.
#
# The raw value is always preserved. `role_category` / `company_type` are
# controlled vocabularies so scoring can be done in code instead of by an LLM.
#
# Classification picks the category whose pattern has the LONGEST match inside
# the normalized position/company string (ties broken by file order).
# Pattern order within a category therefore matters little, but put the most
# specific patterns first.

