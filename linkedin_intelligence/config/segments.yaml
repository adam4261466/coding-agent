# Segment definitions for Phase 2 candidate pools.
#
# Every prospect is assigned to every segment whose rules ALL match.
# Rules may combine: role_category, company_type (lists), score bounds,
# conversation/engagement minimums. A prospect with no matching segment gets
# "unsegmented" so nothing silently falls out of the pipeline.
#
# `research_quota` is used to diversify a research batch (see icp.yaml ->
# research.quotas for the authoritative counts; this file defines the segments).

segments:
  - name: ai_ml_high_icp
    description: AI/ML roles with high ICP fit
    rules:
      role_category: [ai_ml]
      min_total_score: 50

  - name: software_engineering_high_icp
    description: Software engineers at tech/startup companies
    rules:
      role_category: [software_engineering]
      company_type: [startup, technology]
      min_total_score: 50

  - name: data_high_icp
    description: Data roles with high ICP fit
    rules:
      role_category: [data]
      min_total_score: 50

  - name: leadership_high_icp
    description: Founders/CTO/leaders with high ICP fit
    rules:
      role_category: [leadership]
      min_total_score: 50

  - name: students_high_icp
    description: Students with plausible fit
    rules:
      role_category: [student]
      min_total_score: 45

  - name: warm_relationships
    description: Anyone with a prior conversation (warm, regardless of score)
    rules:
      conversation_count_min: 1

  - name: engaged_relationships
    description: Recent two-way conversation or a buying signal
    rules:
      engagement_min: 40

  - name: document_heavy_problem
    description: "Heuristic: roles/industries where document-heavy workflows are plausible"
    rules:
      role_category: [data, ai_ml, software_engineering, consulting]
      company_type: [startup, technology, enterprise, consulting]
