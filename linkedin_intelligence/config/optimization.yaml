# Phase 4 optimization engine configuration. Rules, not guesses.

# Primary metric hierarchy (1 = most important). The optimizer never ranks a
# lower metric above a higher one when the higher one is observable.
metric_hierarchy:
  1: revenue
  2: activated_users
  3: customers
  4: signups
  5: positive_conversations
  6: replies
  7: activity

# Exploration vs exploitation of the prospect pool / strategies.
# 70-80% exploitation, 20-30% exploration is the default.
allocation:
  exploitation: 0.75
  exploration: 0.25

# Statistical guardrails.
minimum_sample: 20            # minimum events before any claim is made
z_confidence: 1.96            # ~95% confidence interval
min_effect_to_claim: 0.05     # absolute rate difference needed to call a winner

# What the optimizer may NEVER do automatically (human approval required).
human_approval_required:
  - icp_change
  - campaign_change
  - messaging_change
