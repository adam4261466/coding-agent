# Ideal Customer Profile - initial hypotheses, not facts.
# Edit this file; the pipeline never hardcodes these values in Python.

product:
  name: Doxium
  summary: developer-focused AI document platform
  problems:
    - document-heavy workflows
    - manual document processing
    - unstructured data extraction

target_roles:
  ai_ml: 1.0
  software_engineering: 0.9
  data: 0.95
  leadership: 0.85
  consulting: 0.6
  sales_marketing: 0.4
  academia: 0.5
  student: 0.4
  unknown: 0.25

target_company_types:
  startup: 1.0
  technology: 1.0
  research: 0.9
  university: 0.6
  enterprise: 0.5
  consulting: 0.5
  government: 0.2
  healthcare: 0.4
  unknown: 0.3

# Initial heuristic problem affinity per role category (0-1).
# THIS IS AN INITIAL HYPOTHESIS ONLY. problem_fit_score stays UNKNOWN (None)
# until Phase 2 evidence/qualification produces it. This affinity is used as a
# low-confidence ordering hint when no research has happened yet.
problem_affinity:
  ai_ml: 0.7
  data: 0.8
  software_engineering: 0.5
  consulting: 0.5
  leadership: 0.5
  academia: 0.4
  sales_marketing: 0.3
  student: 0.3
  unknown: 0.2

# Score weights (dimensions stay SEPARATE; this only combines them for the
# ordering score). Never collapse the dimensions into one opaque score.
weights:
  relevance: { role: 0.6, company: 0.4 }
  total:
    relevance: 0.45
    relationship: 0.25
    engagement: 0.15
    buying_signal: 0.15
  # When problem_fit becomes known (with evidence), blend it in:
  problem_fit_blend_when_known: 0.25

# Engagement scoring (interaction-based, 0-100).
engagement:
  no_conversation: 0
  has_conversation_base: 40
  response_received: 20
  inbound_last: 10
  message_count_3plus: 10
  recency_90d: 20
  recency_180d: 10
  recency_365d: 5

# Buying signal scoring (from structured commercial_intent).
buying_signal:
  explicit: 85
  possible: 50
  none: 5
  unknown: 0

# A prospect at/above these bands is considered "high relevance".
# Note: with the current weights, the existing-connection baseline contributes
# ~30*0.25 = 7.5 and the practical ceiling is ~53-63, so these thresholds are
# calibrated to that reachable range, not to 100.
high_relevance_threshold: 48
potential_relevance_threshold: 35

# Hard-exclusion rules evaluated in code before any scoring.
hard_exclusions:
  max_connections_to_keep: 500
  # Companies whose employees we never prospect (own company, non-customers...).
  # `linkedin` is here because this pipeline operates ON LinkedIn itself.
  ignore_companies:
    - doxium
    - linkedin
  ignore_role_categories: []
  # Schools/universities to skip (case-insensitive partial match).
  ignore_schools: []

# Phase 2 research budget - prevents the browser agent from wandering forever.
research:
  top_n: 0  # 0 = no cap, research all eligible prospects
  budget:
    max_steps: 8
    max_snapshots: 3
    max_pages: 1
    max_evidence: 5
  # Diversification: no single company may fill more of the batch.
  max_candidates_per_company: 3
  # Segment quotas for a research batch. `default_quota` fills the remainder.
  quotas:
    ai_ml_high_icp: 5
    software_engineering_high_icp: 5
    data_high_icp: 4
    leadership_high_icp: 3
    students_high_icp: 3
    warm_relationships: 3
  default_quota: 2

# Qualification thresholds (fit_score 0-100).
qualification:
  ready_for_review: 27  # lowered to mean fit_score from Phase 2 run
  research_more: 20
  skip_below: 10
  # A READY_FOR_HUMAN_REVIEW recommendation needs at least this confidence.
  min_confidence_for_ready: 0.5

# Keyword detection is ONLY a deterministic fallback for conversation
# classification. When no keyword matches, the field stays "unknown" - the
# system never manufactures intent.
conversation_keywords:
  sentiment_positive:
    - thanks
    - thank you
    - merci
    - super
    - great
    - cool
    - génial
    - genial
    - parfait
    - bien recu
    - ok
    - nice
  sentiment_negative:
    - desolé
    - desole
    - sorry
    - pas possible
    - malheureusement
    - unfortunately
    - no thank
  product_interest:
    - interessé
    - interessee
    - interested
    - demo
    - essai
    - essayer
    - gratuitement
    - je veux
    - j'aimerais
    - pourquoi pas
    - sign up
    - inscrit
    - voir
    - en savoir plus
    - curieux
    - curious
    - plus d'info
    - me parler
    - contact
  pain_signal:
    - document
    - documents
    - rapport
    - rapports
    - reporting
    - factures
    - facture
    - invoices
    - contracts
    - contrat
    - contrats
    - excel
    - pdf
    - fastidieux
    - time-consuming
    - workload
    - débordé
    - deborde
    - overwhelmed
    - manuel
    - manual
    - process
    - dossier
    - paperasse
    - automatiser

commercial_signal:
  explicit_interest:
    - interessé
    - interessee
    - interested
    - oui
    - parfait
    - demo
    - essai
    - essayer
    - rendez-vous
    - meet
    - disponible
    - prix
    - tarif
    - budget
    - sign up
    - inscrit
    - gratuitement
    - je veux
    - j'aimerais
    - pourquoi pas
  possible_interest:
    - voir
    - en savoir plus
    - savoir plus
    - détails
    - details
    - curieux
    - curious
    - plus d'info
    - me parler
    - contact
    - whatsapp
    - email
  declined:
    - pas interessé
    - pas intéressé
    - not interested
    - non merci
    - no thanks
    - désolé
    - desole
    - sorry
    - unfortunately
    - ne correspond
    - no need

# Agent configuration (fully automatic outreach loop).
agent:
  # Default mode: "auto" (agent executes) or "manual" (requires human approval)
  default_mode: auto
  # Cycle delay in seconds when no work is available
  idle_delay_seconds: 60
  # Maximum cycles before the agent stops (null = infinite)
  max_cycles: null
  # Browser model for LinkedIn actions
  browser_model: gemma4:31b-cloud
  # Planning model for decision-making
  planner_model: qwen3.5:0.8b
  # Rate limits (seconds between actions per prospect)
  rate_limits:
    send_connection_request: 604800  # 7 days
    send_message: 86400  # 24 hours
    observe_profile: 3600  # 1 hour
    produce_message: 3600  # 1 hour
    follow_up: 86400  # 24 hours
    endorse_skill: 604800  # 7 days

# UI configuration
ui:
  agent_default_mode: auto
